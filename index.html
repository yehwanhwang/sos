<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>비상연락망</title>
    <meta name="description" content="연락이 안 될 때 가족이 전화해 볼 사람을 적어 두는 곳" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <!-- GitHub Pages 는 응답 헤더를 정할 수 없어서 보안 정책을 여기에 둔다. 서버는 구글 Apps Script 하나뿐이다. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'" />
    <meta name="format-detection" content="telephone=no" />
    <!-- 밝기와 글자 크기는 폰 설정을 따른다(app.css). text-scale: 크롬이 폰의 글자 크기만큼 rem 을 키운다. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="text-scale" content="scale" />
    <meta name="theme-color" content="#1b1b1b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta property="og:title" content="비상연락망" />
    <meta property="og:description" content="연락이 안 될 때 가족이 전화해 볼 사람을 적어 두는 곳" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preload" href="fonts/vz-sans-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/app.css" />
    <script src="config.js"></script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div id="app">
      <!-- 스크립트가 첫 화면을 그리기 전까지 보인다(느린 연결에서 빈 화면이 되지 않게) -->
      <div class="boot" role="status">
        <p>비상연락망</p>
        <span class="dots" aria-label="불러오는 중"><i></i><i></i><i></i></span>
      </div>
      <noscript>이 페이지는 자바스크립트가 켜져 있어야 열려요.</noscript>
    </div>
  </body>
</html>
